<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>TDS 3D SIGINT World</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;background:#06080a;color:#dcefff;font-family:system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;padding:20px;gap:20px">
        <header style="display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(125,242,230,.35);padding:12px 14px;background:rgba(4,11,13,.78)">
          <strong style="color:#7df2e6">TDS</strong>
          <span>Static fallback while React initializes</span>
        </header>
        <section style="position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(125,242,230,.24);background:linear-gradient(135deg,#05070a,#101416)">
          <div style="position:absolute;width:220px;height:420px;border:2px solid rgba(125,242,230,.75);box-shadow:0 0 28px rgba(125,242,230,.35);transform:perspective(640px) rotateX(58deg) rotateZ(-8deg)">
            <div style="position:absolute;left:20%;top:0;width:1px;height:100%;background:rgba(125,242,230,.35)"></div>
            <div style="position:absolute;left:52%;top:0;width:1px;height:100%;background:rgba(125,242,230,.35)"></div>
            <div style="position:absolute;left:0;top:28%;width:100%;height:1px;background:rgba(125,242,230,.35)"></div>
            <div style="position:absolute;left:0;top:62%;width:100%;height:1px;background:rgba(125,242,230,.35)"></div>
          </div>
          <div style="position:absolute;width:18px;height:18px;border-radius:999px;background:#57d7ff;box-shadow:0 0 26px #57d7ff;transform:translate(150px,-80px)"></div>
          <div style="position:absolute;width:14px;height:14px;border-radius:999px;background:#8dff9b;box-shadow:0 0 22px #8dff9b;transform:translate(-140px,42px)"></div>
          <div style="position:absolute;width:20px;height:20px;border-radius:999px;background:#ff4d6d;box-shadow:0 0 30px #ff4d6d;transform:translate(78px,116px)"></div>
          <div style="position:relative;z-index:1;text-align:center;padding:24px;margin-top:340px">
            <h1 style="margin:0;font-size:clamp(2rem,8vw,5.5rem);letter-spacing:0">TDS Lab</h1>
            <p style="margin:12px auto 0;max-width:620px;line-height:1.5;color:rgba(220,239,255,.82)">3D SIGINT world preview: townhouse wireframe, Wi-Fi/BLE/unknown RF markers, and airspace layer loading.</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
